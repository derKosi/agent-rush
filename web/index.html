<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Rush</title>
<link rel="stylesheet" href="app.css?v=32">
<script>
  try { var t = localStorage.getItem('ar-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark"></span>
      <div>
        <strong>Agent Rush</strong>
        <small>Acme Corp.</small>
      </div>
    </div>

    <button class="newrun" id="new-run">New run</button>

    <div class="rail-label">Recent runs</div>
    <ul class="rail" id="run-list"></ul>

    <div class="rail-foot">
      <a class="rail-link" href="/api/docs" target="_blank" rel="noopener">API reference</a>
      <a class="rail-link" href="https://github.com/derKosi/agent-rush" target="_blank" rel="noopener">Source</a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumbs">
        <span class="crumb-org">Acme Corp.</span>
        <span class="crumb-sep">/</span>
        <span class="crumb-here">Runs</span>
      </div>
      <div class="topbar-right">
        <span class="modelchip" id="model-chip">…</span>
        <button class="icon-btn" id="theme-toggle" title="Switch theme">☾</button>
        <div class="account">
          <span class="avatar">A</span>
          <span class="who"><strong>Alice</strong><small>Owner <em class="demo">demo</em></small></span>
        </div>
      </div>
    </header>

    <div class="content">
    <section class="placeholder" id="placeholder">
      <h1>Pick a run</h1>
      <p>Every package is installed, imported and resolved inside a sandbox on Vultr. Pick a run
        on the left, or start a new one.</p>
    </section>

    <div id="runview" hidden>
      <header class="runhead">
        <div class="rh-line">
          <span class="badge" id="risk-badge">—</span>
          <h1 id="pkg-name">—</h1>
          <span class="rh-meta" id="run-meta"></span>
        </div>
        <p class="rh-sub" id="run-question"></p>
        <nav class="tabs" id="tabs">
          <button class="tab active" data-tab="summary">Summary</button>
          <button class="tab" data-tab="deps">Dependencies</button>
          <button class="tab" data-tab="evidence">Evidence</button>
        </nav>
      </header>

      <section class="pane" id="pane-summary"></section>
      <section class="pane" id="pane-deps" hidden></section>
      <section class="pane" id="pane-evidence" hidden></section>
    </div>
    </div>
  </main>
</div>

<dialog id="newrun">
  <form method="dialog" id="run-form">
    <h2>New run</h2>
    <label for="pkg">Package</label>
    <input id="pkg" value="fixtures/harborline-2.9.1.tar.gz" spellcheck="false">
    <label for="q">Question</label>
    <textarea id="q" rows="2">Is this safe to install on a developer machine?</textarea>
    <label class="check"><input type="checkbox" id="proxy" checked> <span>Route egress through the deny proxy</span></label>
    <p class="note" id="form-note"></p>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="submit-run">Run triage</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=30"></script>
</body>
</html>
