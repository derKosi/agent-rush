<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Rush — Package Triage</title>
<link rel="stylesheet" href="app.css?v=3">
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="dot"></span>
    <strong>Agent Rush</strong>
    <span class="sub">untrusted package triage · Vultr</span>
  </div>
  <div class="status" id="status">idle</div>
</header>

<main class="grid">
  <section class="panel wide" id="history">
    <h2>Recent runs <span class="tag" id="history-count"></span></h2>
    <ul class="history" id="history-list"><li class="empty">loading…</li></ul>
  </section>

  <section class="panel" id="task">
    <h2>Task</h2>
    <label for="pkg">Package</label>
    <input id="pkg" value="fixtures/sample_pkg-0.1.0.tar.gz" spellcheck="false">
    <label for="q">Question</label>
    <textarea id="q" rows="2">Is this safe to install on a developer machine?</textarea>
    <label class="row">
      <input type="checkbox" id="proxy" checked>
      <span>egress through the deny proxy (shows the attempted host)</span>
    </label>
    <button id="run">Run triage</button>
    <p class="note" id="note"></p>
  </section>

  <section class="panel" id="plan">
    <h2>Plan <span class="tag" id="plan-source"></span></h2>
    <div class="chips" id="probes"></div>
    <p class="reason" id="plan-reason">the model has not planned anything yet</p>
  </section>

  <section class="panel" id="verdict">
    <h2>Verdict</h2>
    <div id="risk"><span class="badge muted">no verdict</span></div>
    <p class="summary" id="summary"></p>
    <p class="note" id="rejected"></p>
  </section>

  <section class="panel wide" id="findings-panel">
    <h2>Findings <span class="tag" id="finding-count"></span></h2>
    <ul class="findings" id="findings"><li class="empty">nothing yet</li></ul>
  </section>

  <section class="panel" id="evidence">
    <h2>Evidence</h2>
    <ul class="evidence" id="artifacts"><li class="empty">no artifacts yet</li></ul>
    <p class="note" id="egress"></p>
  </section>

  <section class="panel" id="trace">
    <h2>Trace</h2>
    <ol class="trace" id="trace-list"><li class="empty">no run yet</li></ol>
  </section>
</main>

<footer class="bar foot">
  <span>Vultr Cloud Compute · Serverless Inference · sandboxed execution</span>
  <span id="runid"></span>
</footer>

<script src="app.js?v=3"></script>
</body>
</html>
