<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4CC2A0"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B949E"/>
    </marker>
    <style>
      .box   { fill:#151B23; stroke:#232B36; stroke-width:1.5; rx:10; }
      .hot   { fill:#151B23; stroke:#4CC2A0; stroke-width:1.5; rx:10; }
      .warn  { fill:#151B23; stroke:#D29922; stroke-width:1.5; rx:10; }
      .t     { fill:#E6EDF3; font-size:14px; }
      .m     { fill:#8B949E; font-size:11.5px; }
      .acc   { fill:#4CC2A0; font-size:12px; }
      .lab   { fill:#8B949E; font-size:10.5px; letter-spacing:.09em; }
      .flow  { stroke:#4CC2A0; stroke-width:1.5; fill:none; marker-end:url(#a); }
      .chan  { stroke:#8B949E; stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#r); }
    </style>
  </defs>

  <rect width="1240" height="780" fill="#0D1117"/>

  <text class="lab" x="40" y="42">AGENT RUSH — CONTROL PLANE</text>
  <text class="m" x="40" y="62">one task, three execution phases, three evidence sources that the sandboxed process cannot write</text>

  <!-- browser / edge -->
  <rect class="box" x="40" y="110" width="230" height="66"/>
  <text class="t" x="56" y="138">Browser</text>
  <text class="m" x="56" y="158">task · plan · verdict · artifacts</text>

  <rect class="box" x="40" y="200" width="230" height="66"/>
  <text class="t" x="56" y="228">Caddy :80</text>
  <text class="m" x="56" y="248">only 22/80/443 open</text>

  <rect class="box" x="40" y="290" width="230" height="86"/>
  <text class="t" x="56" y="318">FastAPI :8080</text>
  <text class="m" x="56" y="338">localhost only · guard</text>
  <text class="m" x="56" y="356">12/h per IP · 1 at a time</text>

  <path class="flow" d="M155 176 L155 198"/>
  <path class="flow" d="M155 266 L155 288"/>
  <path class="flow" d="M272 333 L332 333"/>

  <!-- orchestrator -->
  <rect class="hot" x="336" y="150" width="300" height="330"/>
  <text class="lab" x="352" y="176">ORCHESTRATOR</text>

  <rect class="box" x="352" y="190" width="268" height="52"/>
  <text class="acc" x="364" y="211">1  plan</text>
  <text class="m" x="364" y="230">model picks probes · mandatory floor</text>

  <rect class="box" x="352" y="252" width="268" height="52"/>
  <text class="acc" x="364" y="273">2  build</text>
  <text class="m" x="364" y="292">pip install · npm install</text>

  <rect class="box" x="352" y="314" width="268" height="52"/>
  <text class="acc" x="364" y="335">3  import</text>
  <text class="m" x="364" y="354">top-level modules, deliberately</text>

  <rect class="box" x="352" y="376" width="268" height="52"/>
  <text class="acc" x="364" y="397">4  resolve</text>
  <text class="m" x="364" y="416">wheels only · never executed</text>

  <rect class="box" x="352" y="438" width="268" height="32"/>
  <text class="acc" x="364" y="459">5  verdict — rules set the floor</text>

  <!-- model -->
  <rect class="box" x="700" y="150" width="300" height="86"/>
  <text class="t" x="716" y="178">Vultr Serverless Inference</text>
  <text class="m" x="716" y="198">glm-5.2 · reasoning off</text>
  <text class="m" x="716" y="216">plan · inspection script · verdict</text>
  <path class="chan" d="M636 216 L698 200"/>

  <!-- sandbox -->
  <rect class="box" x="700" y="262" width="300" height="120"/>
  <text class="lab" x="716" y="286">SANDBOX CONTAINER</text>
  <text class="m" x="716" y="308">--read-only   --user 10001</text>
  <text class="m" x="716" y="326">--cap-drop ALL   --pids-limit 64</text>
  <text class="m" x="716" y="344">--memory 512m   --tmpfs /tmp:noexec</text>
  <text class="m" x="716" y="362">--network none (build, import)</text>
  <path class="flow" d="M636 278 L698 300"/>
  <path class="flow" d="M636 340 L698 330"/>
  <path class="flow" d="M636 402 L698 352"/>

  <!-- resolve has network -->
  <rect class="warn" x="700" y="398" width="300" height="52"/>
  <text class="acc" x="716" y="419">resolve gets network — alone</text>
  <text class="m" x="716" y="438">its own container · wheels only</text>
  <path class="flow" d="M636 402 L698 420"/>

  <!-- proxy -->
  <rect class="box" x="700" y="466" width="300" height="66"/>
  <text class="t" x="716" y="492">Deny proxy</text>
  <text class="m" x="716" y="512">default deny · logs host + decision</text>
  <path class="flow" d="M700 360 L676 360 L676 495 L696 495"/>

  <!-- evidence -->
  <rect class="hot" x="336" y="560" width="664" height="98"/>
  <text class="lab" x="352" y="586">EVIDENCE — WRITTEN OUTSIDE THE SANDBOX</text>
  <text class="m" x="352" y="608">egress.jsonl (proxy)  ·  fsdiff.json (host)  ·  exec.json (runner)</text>
  <text class="m" x="352" y="628">probe.json, import_probe.json — self-report, informational only</text>

  <path class="chan" d="M850 532 L850 558"/>
  <path class="chan" d="M470 484 L470 558"/>

  <!-- verdict -->
  <rect class="box" x="1040" y="560" width="160" height="98"/>
  <text class="t" x="1056" y="590">Verdict</text>
  <text class="m" x="1056" y="612">risk + findings</text>
  <text class="m" x="1056" y="630">+ rejected claims</text>
  <path class="chan" d="M1002 609 L1038 609"/>

  <!-- notes -->
  <text class="m" x="336" y="700">The model may raise the risk level. It cannot lower it, and a claim citing a source that does not exist in this run is dropped.</text>
  <text class="m" x="336" y="722">Dependency wheels are hashed and listed, never installed. A malicious dependency is visible, not caught — the README says so.</text>
</svg>
